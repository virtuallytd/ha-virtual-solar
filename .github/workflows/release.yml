name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.8.1
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check manifest version matches tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          manifest_version=$(jq -r .version custom_components/virtual_solar/manifest.json)
          if [ "$manifest_version" != "${TAG#v}" ]; then
            echo "::error::Tag $TAG does not match manifest.json version $manifest_version"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '
            index($0, "## " v " (") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::No CHANGELOG.md entry found for ${TAG#v}"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
